<linearGradient id="trim"><stop stop-color="#1a5b9f"/><stop offset=".55" stop-color="#74e4ff"/><stop offset="1" stop-color="#1b518a"/></linearGradient>
<radialGradient id="field"><stop stop-color="#006bff" stop-opacity=".28"/><stop offset="1" stop-color="#006bff" stop-opacity="0"/></radialGradient>
<pattern id="blueprint" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" stroke="#1c71b3" stroke-opacity=".23" fill="none"/></pattern></defs>
<g transform="translate(5 5)">
