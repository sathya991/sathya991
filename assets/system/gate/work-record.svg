<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="186" viewBox="0 0 1120 186" role="img" aria-labelledby="title">
<title id="title">Worksoft impact. Over 80% less file upload time, about 20% lower p95 latency, and about 30% lower peak database CPU usage.</title>
<defs>
