<text x="20" y="31" font-family="ui-monospace,Consolas,monospace" font-size="15" font-weight="700" fill="#89cffb" letter-spacing=".8">01 / FILE INGESTION</text>
<text x="18" y="108" font-family="Arial,Liberation Sans,sans-serif" font-size="64" font-weight="800" fill="#e5f9ff" >&gt;80%</text>
<text x="20" y="137" font-family="ui-monospace,Consolas,monospace" font-size="19" font-weight="400" fill="#a8dcff" >Less upload time</text>
<path d="M20 153h316m-316 0h82" stroke="#257ebf" fill="none"/>
