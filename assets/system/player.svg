<svg xmlns="http://www.w3.org/2000/svg" width="960" height="390" viewBox="0 0 960 390" role="img" aria-labelledby="title desc">
  <title id="title">System online · Satya Srivatsav</title>
  <desc id="desc">Electric-blue System notification with an animated radar. Software developer at Worksoft.</desc>
  <defs>
    <linearGradient id="background" x2="0" y2="1" gradientUnits="objectBoundingBox">
      <stop stop-color="#061426"/>
      <stop offset="1" stop-color="#020610"/>
    </linearGradient>
    <linearGradient id="metal">
      <stop stop-color="#1177e0"/>
      <stop offset=".22" stop-color="#78eaff"/>
      <stop offset=".48" stop-color="#114383"/>
      <stop offset=".83" stop-color="#189cf2"/>
      <stop offset="1" stop-color="#9bf8ff"/>
    </linearGradient>
    <linearGradient id="rail">
      <stop stop-color="#0e3aac" stop-opacity="0"/>
      <stop offset=".18" stop-color="#0870ff"/>
      <stop offset=".5" stop-color="#73f3ff"/>
      <stop offset=".82" stop-color="#117aff"/>
      <stop offset="1" stop-color="#0e3aac" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="haze">
